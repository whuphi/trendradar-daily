name: Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1 direct with browser UA
        run: |
          code=$(curl -s -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" -o /tmp/a.json -w "%{http_code}" "https://newsnow.busiyi.world/api/s?id=toutiao&latest")
          echo "direct http=$code bytes=$(wc -c < /tmp/a.json)"
          head -c 200 /tmp/a.json; echo

      - name: 2 via allorigins proxy
        run: |
          enc=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://newsnow.busiyi.world/api/s?id=toutiao&latest', safe=''))")
          code=$(curl -s -m 30 -o /tmp/b.json -w "%{http_code}" "https://api.allorigins.win/raw?url=$enc")
          echo "allorigins http=$code bytes=$(wc -c < /tmp/b.json)"
          head -c 200 /tmp/b.json; echo

      - name: 3 via jina reader
        run: |
          code=$(curl -s -m 30 -o /tmp/c.txt -w "%{http_code}" "https://r.jina.ai/https://newsnow.busiyi.world/api/s?id=toutiao&latest")
          echo "jina http=$code bytes=$(wc -c < /tmp/c.txt)"
          head -c 200 /tmp/c.txt; echo

      - name: 4 rss reachable
        run: |
          for u in "https://www.solidot.org/index.rss" "https://36kr.com/feed" "https://sspai.com/feed"; do
            code=$(curl -s -m 20 -o /tmp/r.xml -w "%{http_code}" "$u")
            echo "$u http=$code bytes=$(wc -c < /tmp/r.xml)"
          done
